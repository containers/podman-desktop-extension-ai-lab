name: CI

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'OCI image tag to publish (use a non-"nightly" tag to build a branch image for testing)'
        default: 'nightly'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Execute pnpm
        run: pnpm install

      - name: Run Build
        run: pnpm build

      - name: Login to ghcr.io
        run: podman login --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io

      - name: Publish Image
        id: publish-image
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'nightly' }}
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/podman-desktop-extension-ai-lab
          IMAGE_TAGGED=${IMAGE_NAME}:${IMAGE_TAG}
          IMAGE_SHA=${IMAGE_NAME}:${GITHUB_SHA}
          podman build -t "$IMAGE_TAGGED" .
          podman push "$IMAGE_TAGGED"
          podman tag "$IMAGE_TAGGED" "$IMAGE_SHA"
          podman push "$IMAGE_SHA"
