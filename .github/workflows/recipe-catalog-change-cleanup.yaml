name: recipe-catalog-change-cleanup

on:
  workflow_run:
    workflows: ["recipe-catalog-change-windows-trigger"]
    types:
      - completed

jobs:
  extract-context:
    runs-on: ubuntu-24.04
    outputs:
      extract-context: ${{ steps.prepare-context.outputs.extract-context }}
      trigger-template: ${{ steps.prepare-context.outputs.trigger-template }}
    steps:
      - name: Prepare context
        id: prepare-context
        env:
          WORKFLOW_RUN: ${{ toJson(github.event.workflow_run) }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read fork-controlled values from env, not expressions, to avoid script injection
          echo "$WORKFLOW_RUN" | jq -r '"Workflow run ID: \(.id)\nFork owner: \(.head_repository.owner.login)\nFork repo: \(.head_repository.name)\nFork branch: \(.head_branch)\nCommit SHA: \(.head_sha)\nBase repo: \(.repository.full_name)\nConclusion: \(.conclusion)"'
          # Fetch job conclusions using the GitHub CLI
          echo "Fetching jobs for workflow run ID: ${RUN_ID}"
            gh api \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | "\(.name)=\(.conclusion)"' | while read -r line; do
              echo "$line" >> $GITHUB_OUTPUT
            done
          cat $GITHUB_OUTPUT
  cleanup:
    runs-on: ubuntu-24.04
    needs: extract-context
    if: ${{ github.event.workflow_run.conclusion == 'skipped' || (github.event.workflow_run.conclusion == 'success' && needs.extract-context.outputs.trigger-template == 'skipped') }}
    steps:
      - name: Remove skipped or cancelled workflow run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          BASE_REPO: ${{ github.event.workflow_run.repository.full_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up workflow run ID: ${RUN_ID}"
          gh run delete "${RUN_ID}" --repo "${BASE_REPO}"
          echo "Workflow run ID ${RUN_ID} has been cleaned up."
