name: Run recipe tests on catalog change

on:
  # TEMP: manual testing only, drop before merge
  workflow_dispatch:
    inputs:
      trigger-workflow-run-id:
        type: string
        required: false
      trigger-workflow-fork:
        type: string
        required: false
      trigger-workflow-repo-name:
        type: string
        required: false
      trigger-workflow-branch:
        type: string
        required: false
      trigger-workflow-commit-sha:
        type: string
        required: false
      trigger-workflow-base-repo:
        type: string
        required: false
      pd-fork:
        type: string
        required: false
      pd-branch:
        type: string
        required: false
      ext_tests_options:
        type: string
        required: false
      e2e-runner-version:
        type: string
        required: false
  workflow_call:
    inputs:
      trigger-workflow-run-id:
        required: true
        type: string
      trigger-workflow-fork:
        required: true
        type: string
      trigger-workflow-repo-name:
        required: true
        type: string
      trigger-workflow-branch:
        required: true
        type: string
      trigger-workflow-commit-sha:
        required: true
        type: string
      trigger-workflow-base-repo:
        required: true
        type: string
      pd-fork:
        required: false
        type: string
      pd-branch:
        required: false
        type: string
      pd-env-vars:
        required: false
        type: string
      podman-options:
        required: false
        type: string
      podman-download-url:
        required: false
        type: string
      ext_tests_options:
        required: false
        type: string
      npm-target:
        required: false
        type: string
      e2e-runner-version:
        required: false
        type: string
      mapt_params:
        required: false
        type: string

jobs:
  windows:
    name: recipe-catalog-windows-${{ matrix.windows-version }}-${{ matrix.windows-featurepack }}
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    # Runs PR code from forks on an Azure VM: add required reviewers to this environment to gate it
    environment: recipe-catalog-tests
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['11']
        windows-featurepack: ['25h2-ent']

    steps:
    - name: Add PR check status
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        status_context="catalog-change-windows-matrix-${{ matrix.windows-version }}-${{ matrix.windows-featurepack }}"
        echo "status_context=${status_context}" >> "$GITHUB_ENV"
        set -xuo
        # Status msg
        data="{\"state\":\"pending\""
        data="${data},\"description\":\"Running recipe tests on catalog change on Windows ${{ matrix.windows-version }}-${{ matrix.windows-featurepack }}\""
        data="${data},\"context\":\"$status_context\""
        data="${data},\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
        # Create status by API call
        curl -L -v -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
          https://api.github.com/repos/${{ inputs.trigger-workflow-base-repo }}/statuses/${{ inputs.trigger-workflow-commit-sha }} \
          -d "${data}"

    - name: Get Podman version used by Podman Desktop
      id: pd-podman
      run: |
        version=$(curl -fsSL https://raw.githubusercontent.com/podman-desktop/podman-desktop/main/extensions/podman/packages/extension/src/podman.json \
          | jq -r '.versions[.platform.win32.arch.x64.versionRef].tagVersion // empty' || true)
        echo "Podman version used by Podman Desktop on Windows: ${version:-latest}"
        echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

    - name: Fetch Podman installer
      id: fetch-podman
      uses: redhat-actions/podman-install/.github/actions/fetch-latest-podman-version-windows@5b0fb16319979de14e2c7c2c1cc27c98f107ae52
      with:
        version_input: ${{ steps.pd-podman.outputs.version }}
        file_type: 'msi'
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set the default env. variables
      env:
        DEFAULT_NPM_TARGET: 'test:e2e'
        DEFAULT_ENV_VARS: 'TEST_PODMAN_MACHINE=true,ELECTRON_ENABLE_INSPECT=true'
        DEFAULT_PODMAN_OPTIONS: 'INIT=1,START=1,ROOTFUL=1,NETWORKING=0'
        DEFAULT_EXT_TESTS_OPTIONS: 'EXT_RUN_TESTS_FROM_EXTENSION=1'
        # Fork-controlled values, passed via env to avoid script injection
        TRIGGER_REPO: ${{ inputs.trigger-workflow-repo-name }}
        TRIGGER_FORK: ${{ inputs.trigger-workflow-fork }}
        TRIGGER_BRANCH: ${{ inputs.trigger-workflow-branch }}
      run: |
        # run-playwright-test interpolates these into bash, so only allow plain ref characters
        for value in "$TRIGGER_REPO" "$TRIGGER_FORK" "$TRIGGER_BRANCH"; do
          if [[ ! "$value" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Fork, repository or branch name contains unsupported characters"
            exit 1
          fi
        done
        echo "PD_FORK=${{ inputs.pd-fork || 'podman-desktop' }}" >> $GITHUB_ENV
        echo "PD_BRANCH=${{ inputs.pd-branch || 'main' }}" >> $GITHUB_ENV
        echo "NPM_TARGET=${{ inputs.npm-target || env.DEFAULT_NPM_TARGET }}" >> $GITHUB_ENV
        echo "ENV_VARS=${{ inputs.pd-env-vars || env.DEFAULT_ENV_VARS }}" >> $GITHUB_ENV
        echo "PODMAN_URL=${{ inputs.podman-download-url || steps.fetch-podman.outputs.download_url }}" >> $GITHUB_ENV
        echo "E2E_RUNNER_VERSION=${{ inputs.e2e-runner-version || vars.E2E_RUNNER_VERSION || 'nightly' }}" >> $GITHUB_ENV
        # Test the extension from the PR fork/branch that changed the catalog
        echo "EXT_REPO=${TRIGGER_REPO}" >> $GITHUB_ENV
        echo "EXT_FORK=${TRIGGER_FORK}" >> $GITHUB_ENV
        echo "EXT_BRANCH=${TRIGGER_BRANCH}" >> $GITHUB_ENV
        echo "${{ inputs.ext_tests_options || env.DEFAULT_EXT_TESTS_OPTIONS }}" | awk -F ',' \
         '{for (i=1; i<=NF; i++) {split($i, kv, "="); print kv[1]"="kv[2]}}' >> $GITHUB_ENV
        echo "${{ inputs.podman-options || env.DEFAULT_PODMAN_OPTIONS }}" | awk -F ',' \
         '{for (i=1; i<=NF; i++) {split($i, kv, "="); print "PODMAN_"kv[1]"="kv[2]}}' >> $GITHUB_ENV

        # For mapt_params, use repo variables directly if input is empty
        if [ -n "${{ inputs.mapt_params }}" ]; then
          mapt_params="${{ inputs.mapt_params }}"
        else
          mapt_params="IMAGE=${{ vars.MAPT_IMAGE || 'quay.io/redhat-developer/mapt' }};VERSION_TAG=${{ vars.MAPT_VERSION_TAG || 'v0.14.5' }};CPUS=${{ vars.MAPT_CPUS || '8' }};MEMORY=${{ vars.MAPT_MEMORY || '32' }};EXCLUDED_REGIONS=\"${{ vars.MAPT_EXCLUDED_REGIONS || 'westindia,centralindia,southindia,australiacentral,australiacentral2,australiaeast,australiasoutheast,southafricanorth,southafricawest' }}\""
        fi
        echo "$mapt_params" | awk -F ';' '{for (i=1; i<=NF; i++) {split($i, kv, "="); print "MAPT_"kv[1]"="kv[2]}}' >> $GITHUB_ENV

    - name: Create instance
      id: create-instance
      uses: podman-desktop/e2e/.github/actions/create-instance@dbb48583aa0d9b97f95354aab9b60620ca5d7130
      with:
        mapt-image: ${{ env.MAPT_IMAGE || '' }}
        mapt-version: ${{ env.MAPT_VERSION_TAG || '' }}
        windows-version: ${{ matrix.windows-version }}
        windows-featurepack: ${{ matrix.windows-featurepack }}
        cpus: ${{ env.MAPT_CPUS || '' }}
        memory: ${{ env.MAPT_MEMORY || '' }}
        excluded-regions: ${{ env.MAPT_EXCLUDED_REGIONS || '' }}
        arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
        arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
        arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

    - name: Check instance system info
      uses: podman-desktop/e2e/.github/actions/instance-system-info@dbb48583aa0d9b97f95354aab9b60620ca5d7130

    - name: Emulate X session
      uses: podman-desktop/e2e/.github/actions/emulate-x-session@dbb48583aa0d9b97f95354aab9b60620ca5d7130

    - name: Build Podman Desktop Electron Inspect Enabled binary
      uses: podman-desktop/e2e/.github/actions/build-podman-desktop@dbb48583aa0d9b97f95354aab9b60620ca5d7130
      with:
        fork: ${{ env.PD_FORK }}
        branch: ${{ env.PD_BRANCH }}
        env-vars: ${{ env.ENV_VARS }}

    - name: Run Podman Desktop Playwright E2E tests
      uses: podman-desktop/e2e/.github/actions/run-playwright-test@dbb48583aa0d9b97f95354aab9b60620ca5d7130
      with:
        e2e-runner-tag: ${{ env.E2E_RUNNER_VERSION }}
        podman-download-url: ${{ env.PODMAN_URL }}
        podman-desktop-path: true
        fork-repo: ${{ env.PD_FORK }}
        branch-name: ${{ env.PD_BRANCH }}
        ext-repo: ${{ env.EXT_REPO }}
        ext-fork: ${{ env.EXT_FORK }}
        ext-branch: ${{ env.EXT_BRANCH }}
        ext-tests: ${{ env.EXT_RUN_TESTS_FROM_EXTENSION }}
        npm-target: ${{ env.NPM_TARGET }}
        podman-init: ${{ env.PODMAN_INIT }}
        podman-start: ${{ env.PODMAN_START }}
        rootful: ${{ env.PODMAN_ROOTFUL }}
        user-networking: ${{ env.PODMAN_NETWORKING }}
        podman-provider: 'wsl'
        env-vars: ${{ env.ENV_VARS }}
        # The token is copied to the VM where the PR code runs, never hand it to forks
        ci-bot-token: ${{ inputs.trigger-workflow-fork == 'containers' && secrets.PODMAN_DESKTOP_BOT_TOKEN || '' }}

    - name: Publish Test Report
      id: test-report
      uses: mikepenz/action-junit-report@v6
      if: always() # always run even if the previous step fails
      with:
        annotate_only: true
        fail_on_failure: true
        include_passed: true
        detailed_summary: true
        require_tests:  true
        report_paths: '**/*results.xml'

    - name: Update status of the PR check
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -xuo
        # Status msg
        data="{\"state\":\"success\""
        if [[ ${{ steps.test-report.outcome }} != "success" ]]; then
          data="{\"state\":\"failure\""
        fi
        data="${data},\"description\":\"Finished recipe tests on catalog change on Windows ${{ matrix.windows-version }}-${{ matrix.windows-featurepack }}\""
        data="${data},\"context\":\"${{ env.status_context }}\""
        data="${data},\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
        # Create status by API call
        curl -L -v -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
          https://api.github.com/repos/${{ inputs.trigger-workflow-base-repo }}/statuses/${{ inputs.trigger-workflow-commit-sha }} \
          -d "${data}"

    - name: Destroy instance
      if: always() && steps.create-instance.outcome != 'skipped'
      uses: podman-desktop/e2e/.github/actions/destroy-instance@dbb48583aa0d9b97f95354aab9b60620ca5d7130
      with:
        mapt-image: ${{ env.MAPT_IMAGE }}
        mapt-version: ${{ env.MAPT_VERSION_TAG }}
        arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
        arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
        arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: results-e2e-${{ matrix.windows-version }}${{ matrix.windows-featurepack }}
        # The e2e-runner writes results (incl. videos/traces) under results/;
        # keep them, exclude only the large model files.
        path: |
          results/*
          !./**/*.gguf
          !./**/*.bin
