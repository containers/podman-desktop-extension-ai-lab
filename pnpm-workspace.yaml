packages:
  - 'packages/*'
  - 'tools'
  - 'tests/*'
overrides:
  postman-collection>semver: ^7.5.2
  minimatch@^3: ^3.1.5
  minimatch@^5: ^5.1.9
  minimatch@^9: ^9.0.9
  minimatch@^10: ^10.2.6
  fast-uri@^3: ^3.1.9
  multer@^2: ^2.4.0
  uuid@^8: ^11.1.1
  qs@^6: ^6.16.1
  postcss-selector-parser@^6: ^7.1.7
  postcss-selector-parser@^7: ^7.1.7
  dompurify@^3: ^3.4.17
  path-to-regexp@^8: ^8.4.2
nodeLinker: hoisted
allowBuilds:
  '@scarf/scarf': false
  '@tailwindcss/oxide': false
  esbuild: false
  postman-code-generators: false
  svelte-preprocess: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@pnpm/exe@11.28.9'
  - '@pnpm/linux-arm64@11.28.9'
  - '@pnpm/linux-x64@11.28.9'
  - '@pnpm/linuxstatic-x64@11.28.9'
  - '@pnpm/macos-arm64@11.28.9'
  - '@pnpm/win-arm64@11.28.9'
  - '@pnpm/win-x64@11.28.9'
